# Each page blueprint must have a title, the title may be different from the file name
title: Articles

# Each page can have an icon that is shown in page listings when no preview image is available.
icon: 📖

# Define the form layout with two columns
# More about columns: https://getkirby.com/docs/guide/blueprints/layout#defining-columns

tabs:
  articles:
    label: Articles
    icon: page
    columns:
      - width: 1/3
        # In the first column, we reuse the `notes` section
        # (defined in `/site/blueprints/sections/notes.yml` twice with different page status and headline
        sections:
          import:
            type: docximport

          drafts:
            extends: sections/articles
            headline: Drafts
            status: draft

          unlisted:
            extends: sections/articles
            headline: In Review
            status: unlisted

      - width: 2/3
        # In the second column, we reuse the same section, this time for listed pages and with a different headline
        sections:
          listed:
            extends: sections/articles
            headline: Published
            status: listed
            size: small
            layout: cards

    # More about pages sections: https://getkirby.com/docs/reference/panel/sections/pages

  print:
    label: Print CSS
    icon: code
    fields:
      printcss:
        label: PDF print CSS
        type: textarea
        font: monospace
        buttons: false
        help: Shared stylesheet for all article PDFs. Usually edited from the PDF layout editor; empty falls back to front/data/print.css.
