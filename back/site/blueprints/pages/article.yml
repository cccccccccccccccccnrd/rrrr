title: Article

icon: 📖

status:
  draft:
    label: Draft
    text: Only visible to editors in the Panel and the PDF editor.
  unlisted:
    label: In Review
    text: Online for anyone with the direct link, but not listed on the website yet. Use it for review.
  listed:
    label: Published
    text: Online and listed on the website.

columns:
  - width: 2/3
    sections:
      content:
        type: fields
        fields:
          text:
            type: blocks
      history:
        type: history

  - width: 1/3
    sections:
      pdf:
        type: info
        label: PDF
        text: "(link: {{ site.url }}/pdf-editor/{{ page.slug }} text: Open PDF layout editor ↗ target: _blank)"
      meta:
        type: fields
        fields:
          category:
            label: Category
            type: select
            options:
              type: query
              query: site.find("categories").childrenAndDrafts
          abstract:
            type: textarea
          literature:
            type: list
            marks: false
          references:
            type: list
            marks: false
          author:
            type: text
          context:
            type: text
          doi:
            type: text
          suggestion:
            label: Citation Suggestion
            type: text
          license:
            type: text
          download:
            type: text
          correction:
            type: text
          published:
            type: date
            time: true
            default: now
          tags:
            type: tags
          cover:
            type: files
            multiple: false
            query: page.images.template('blocks/image')
            uploads:
              template: blocks/image
      files:
        type: files
        template: blocks/image
